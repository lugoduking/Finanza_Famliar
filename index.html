<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f5f7f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Finanzas Familia</title>
<style>
  :root { color-scheme: light; --bg:#f5f7f2; --card:#fff; --card2:#f1f4ee; --text:#18251f; --muted:#7c8981; --accent:#176b4b; --red:#c75046; --blue:#5484aa; --line:#e8ede7; --shadow:0 10px 30px rgba(28,54,41,.06); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; overscroll-behavior:none; }
  body { background:radial-gradient(ellipse at 50% -180px,#e4efe4 0,transparent 440px),var(--bg); }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
  #app { max-width:560px; margin:0 auto; min-height:100dvh; padding:24px 20px calc(120px + env(safe-area-inset-bottom)); }
  .hello { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:4px 0 22px; }
  .hello h1 { font-size:25px; letter-spacing:-.8px; line-height:1.2; margin:4px 0 0; font-weight:750; }
  .hello small { color:var(--muted); display:block; font-size:13px; letter-spacing:.01em; }
  .rate { background:rgba(255,255,255,.82); border:1px solid rgba(218,228,218,.9); border-radius:14px; padding:10px 12px; font-size:12px; box-shadow:0 3px 12px rgba(28,54,41,.04); white-space:nowrap; }
  .rate b { color:var(--accent); display:block; font-size:13px; margin-top:2px; }
  .balance { position:relative; overflow:hidden; background:linear-gradient(135deg,#174f3c 0%,#176b4b 55%,#26805d 100%); color:#fff; border-radius:27px; padding:25px 23px 23px; margin-bottom:28px; box-shadow:0 16px 32px rgba(23,107,75,.2); }
  .balance:after { content:""; position:absolute; width:190px; height:190px; border-radius:50%; border:1px solid rgba(255,255,255,.12); right:-62px; top:-94px; box-shadow:0 0 0 23px rgba(255,255,255,.035),0 0 0 48px rgba(255,255,255,.025); }
  .balance small { color:#c9dfd2; font-size:13px; position:relative; z-index:1; }
  .balance .big { font-size:clamp(34px,9vw,43px); font-weight:750; letter-spacing:-1.8px; margin:8px 0 3px; position:relative; z-index:1; }
  .balance .bs { color:#c9dfd2; font-size:14px; position:relative; z-index:1; }
  h2 { font-size:12px; color:var(--muted); font-weight:750; margin:27px 0 12px; text-transform:uppercase; letter-spacing:1px; }
  .accounts { display:flex; gap:11px; overflow-x:auto; margin:0 -20px; padding:0 20px 6px; scrollbar-width:none; }
  .accounts::-webkit-scrollbar { display:none; }
  .acc { flex:0 0 158px; background:var(--card); border:1px solid #edf0eb; border-radius:19px; padding:15px; box-shadow:var(--shadow); }
  .acc .ico { width:37px; height:37px; display:grid; place-items:center; background:#eef5ee; border-radius:12px; font-size:19px; }
  .acc .name { color:var(--muted); font-size:12px; margin:11px 0 3px; }
  .acc .amt { font-weight:750; font-size:16px; letter-spacing:-.3px; }
  .list { background:var(--card); border:1px solid #edf0eb; border-radius:20px; overflow:hidden; box-shadow:var(--shadow); }
  .row { display:flex; align-items:center; gap:12px; padding:14px 13px; border-bottom:1px solid #f0f2ef; }
  .row:last-child { border-bottom:0; }
  .row .ico { width:43px; height:43px; border-radius:15px; background:#f2f5ef; display:grid; place-items:center; font-size:19px; flex:none; }
  .row .mid { flex:1; min-width:0; }
  .row .mid b { display:block; font-size:14px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .mid small { color:var(--muted); font-size:11px; display:block; margin-top:3px; }
  .row .amt { text-align:right; font-weight:750; font-size:13px; white-space:nowrap; }
  .row .amt small { display:block; color:var(--muted); font-weight:450; font-size:10px; margin-top:3px; }
  .neg { color:var(--red); } .pos { color:var(--accent); }
  .empty { padding:28px; text-align:center; color:var(--muted); }
  .bud { background:var(--card); border:1px solid #edf0eb; border-radius:19px; padding:17px; margin-bottom:12px; box-shadow:var(--shadow); }
  .bud .top { display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:14px; margin-bottom:13px; }
  .bud .top span:first-child { font-weight:650; }
  .bud .top span:last-child { color:var(--muted); font-size:11px; white-space:nowrap; }
  .bar { height:8px; background:#edf1eb; border-radius:99px; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:99px; background:#52a779; transition:width .3s ease; }
  .bar i.warn { background:#d5a642; } .bar i.over { background:var(--red); }
  .nav { position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:min(100%,560px); z-index:4; background:rgba(255,255,255,.94); border:1px solid rgba(232,237,231,.9); border-bottom:0; border-radius:22px 22px 0 0; display:flex; justify-content:space-around; padding:9px 8px calc(9px + env(safe-area-inset-bottom)); box-shadow:0 -8px 28px rgba(31,56,43,.08); backdrop-filter:blur(18px); }
  .nav button { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; font-weight:600; color:#929d95; padding:5px 0; transition:color .15s; }
  .nav button span { font-size:19px; filter:grayscale(1); opacity:.75; }
  .nav button.on { color:var(--accent); } .nav button.on span { filter:none; opacity:1; }
  .fab { position:fixed; z-index:5; left:calc(50% + 168px); bottom:calc(77px + env(safe-area-inset-bottom)); width:58px; height:58px; border-radius:20px; background:#dbf28a; color:#20432e; font-size:30px; font-weight:450; box-shadow:0 9px 22px rgba(68,105,51,.23); transition:transform .15s,box-shadow .15s; }
  .fab:active { transform:scale(.94); box-shadow:0 4px 12px rgba(68,105,51,.2); }
  .shade { position:fixed; inset:0; z-index:7; background:rgba(14,29,21,.42); opacity:0; pointer-events:none; transition:opacity .2s; backdrop-filter:blur(3px); }
  .sheet { position:fixed; z-index:8; left:0; right:0; bottom:0; max-width:560px; max-height:92dvh; overflow-y:auto; margin:0 auto; background:#fff; border:1px solid var(--line); border-radius:27px 27px 0 0; padding:11px 20px calc(24px + env(safe-area-inset-bottom)); transform:translateY(105%); transition:transform .25s ease; box-shadow:0 -12px 40px rgba(22,43,31,.14); }
  .open .shade { opacity:1; pointer-events:auto; } .open .sheet { transform:none; }
  .grab { width:38px; height:4px; border-radius:9px; background:#dce4da; margin:0 auto 19px; }
  .seg { display:flex; background:#f1f4ef; border-radius:14px; padding:4px; margin-bottom:16px; }
  .seg button { flex:1; padding:10px; border-radius:11px; font-size:14px; font-weight:650; color:var(--muted); }
  .seg button.on { background:#fff; color:var(--text); box-shadow:0 2px 8px rgba(25,47,33,.08); }
  .amount { display:flex; align-items:center; gap:9px; margin-bottom:4px; }
  .amount input { flex:1; min-width:0; background:none; border:0; outline:0; color:var(--text); font-size:42px; font-weight:750; letter-spacing:-1.5px; }
  .amount input::placeholder { color:#c3ccc3; }
  .amount .cur { display:flex; background:#f1f4ef; border-radius:12px; padding:4px; }
  .amount .cur button { padding:8px 11px; border-radius:9px; font-size:13px; font-weight:700; color:var(--muted); }
  .amount .cur button.on { background:var(--accent); color:#fff; }
  .equiv { color:var(--muted); font-size:12px; min-height:18px; margin:0 0 13px; }
  .field { width:100%; background:#f5f7f3; border:1px solid #edf0eb; outline:0; color:var(--text); font:inherit; font-size:14px; padding:14px; border-radius:13px; margin-bottom:12px; }
  .field:focus { border-color:#83b49a; box-shadow:0 0 0 3px rgba(23,107,75,.08); }
  .field::placeholder { color:#98a39a; }
  .chips { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:15px; }
  .chips button { background:#f3f5f1; padding:9px 11px; border-radius:999px; font-size:12px; border:1px solid transparent; color:#536158; }
  .chips button.on { background:#eaf4ec; border-color:#8db99d; color:var(--accent); }
  .save { width:100%; background:var(--accent); color:#fff; font-weight:700; font-size:15px; padding:15px; border-radius:14px; box-shadow:0 7px 15px rgba(23,107,75,.18); }
  .note { color:var(--muted); font-size:11px; text-align:center; margin-top:22px; }
  .link { color:var(--accent); text-decoration:underline; cursor:pointer; }
  @media (max-width:420px) { #app{padding-left:17px;padding-right:17px;padding-top:20px}.hello h1{font-size:23px}.accounts{margin-left:-17px;margin-right:-17px;padding-left:17px;padding-right:17px}.fab{left:auto;right:18px}.row{gap:9px;padding-left:11px;padding-right:11px}.row .amt{font-size:12px} }
  @media (min-width:700px) { #app{padding-top:34px}.nav{bottom:12px;border-radius:22px;border-bottom:1px solid rgba(232,237,231,.9)}.fab{bottom:95px} }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after{scroll-behavior:auto!important;transition:none!important} }
</style>
</head>
<body>
<div id="app"></div>

<button class="fab" id="fab" aria-label="Agregar movimiento">+</button>

<nav class="nav" id="nav">
  <button data-tab="inicio"><span>🏠</span>Inicio</button>
  <button data-tab="presupuesto"><span>🎯</span>Presupuesto</button>
  <button data-tab="familia"><span>👨‍👩‍👧</span>Familia</button>
</nav>

<div id="modal">
  <div class="shade" id="shade"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="seg" id="segType">
      <button data-v="gasto" class="on">Gasto</button>
      <button data-v="ingreso">Ingreso</button>
    </div>
    <div class="amount">
      <input id="fAmount" inputmode="decimal" placeholder="0,00" autocomplete="off">
      <div class="cur" id="segCur">
        <button data-v="USD" class="on">$</button>
        <button data-v="VES">Bs</button>
      </div>
    </div>
    <div class="equiv" id="equiv"></div>
    <input class="field" id="fDesc" placeholder="¿En qué? (ej. mercado)" autocomplete="off">
    <div class="chips" id="chipsCat"></div>
    <select class="field" id="fAcc"></select>
    <div class="chips" id="chipsWho"></div>
    <button class="save" id="save">Guardar</button>
  </div>
</div>

<script>
// Prototipo desechable: datos de ejemplo guardados solo en este teléfono (localStorage). Sin base de datos todavía.
const CATS = { Mercado: '🛒', Servicios: '💡', Transporte: '🚗', Salud: '💊', Comida: '🍔', Hogar: '🏠', Otros: '📦', Ingreso: '💰' };
const PEOPLE = ['Luis', 'Pareja', 'Hogar'];
const KEY = 'finanzas-proto-v1';

const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString(); };
const seed = () => ({
  rate: 200, // tasa de ejemplo, se cambia tocando el botón de arriba
  accounts: [
    { id: 'efe', name: 'Efectivo', ico: '💵', cur: 'USD', start: 320 },
    { id: 'bco', name: 'Banco', ico: '🏦', cur: 'VES', start: 45000 },
    { id: 'zel', name: 'Zelle', ico: '📲', cur: 'USD', start: 850 },
  ],
  budgets: { Mercado: 300, Servicios: 80, Transporte: 60, Comida: 100 },
  moves: [
    { id: 1, type: 'gasto', desc: 'Mercado semanal', cat: 'Mercado', amount: 86.4, cur: 'USD', acc: 'zel', who: 'Hogar', date: daysAgo(0) },
    { id: 2, type: 'gasto', desc: 'Gasolina', cat: 'Transporte', amount: 4000, cur: 'VES', acc: 'bco', who: 'Luis', date: daysAgo(1) },
    { id: 3, type: 'ingreso', desc: 'Pago de cliente', cat: 'Ingreso', amount: 400, cur: 'USD', acc: 'zel', who: 'Luis', date: daysAgo(2) },
    { id: 4, type: 'gasto', desc: 'Internet', cat: 'Servicios', amount: 25, cur: 'USD', acc: 'efe', who: 'Hogar', date: daysAgo(3) },
    { id: 5, type: 'gasto', desc: 'Farmacia', cat: 'Salud', amount: 3200, cur: 'VES', acc: 'bco', who: 'Pareja', date: daysAgo(4) },
    { id: 6, type: 'gasto', desc: 'Hamburguesas', cat: 'Comida', amount: 22, cur: 'USD', acc: 'efe', who: 'Pareja', date: daysAgo(5) },
  ],
});

let db;
try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!db) db = seed();
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} };

const num = (n, d = 2) => n.toLocaleString('es-VE', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmt = (n, cur) => cur === 'USD' ? '$' + num(n) : 'Bs ' + num(n);
const toUSD = (n, cur) => cur === 'USD' ? n : n / db.rate;
const sign = m => m.type === 'gasto' ? -1 : 1;
const accBalance = a => a.start + db.moves.filter(m => m.acc === a.id).reduce((s, m) => s + sign(m) * m.amount, 0);
const thisMonth = m => { const d = new Date(m.date), n = new Date(); return d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear(); };
const dayLabel = iso => {
  const d = new Date(iso), n = new Date();
  const diff = Math.round((new Date(n.toDateString()) - new Date(d.toDateString())) / 864e5);
  return diff === 0 ? 'Hoy' : diff === 1 ? 'Ayer' : d.toLocaleDateString('es-VE', { day: 'numeric', month: 'short' });
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const rowHTML = m => {
  const acc = db.accounts.find(a => a.id === m.acc);
  const other = m.cur === 'USD' ? fmt(m.amount * db.rate, 'VES') : fmt(m.amount / db.rate, 'USD');
  return `<div class="row">
    <div class="ico">${CATS[m.cat] || '📦'}</div>
    <div class="mid"><b>${esc(m.desc)}</b><small>${dayLabel(m.date)} · ${esc(acc.name)} · ${esc(m.who)}</small></div>
    <div class="amt ${m.type === 'gasto' ? 'neg' : 'pos'}">${m.type === 'gasto' ? '−' : '+'}${fmt(m.amount, m.cur)}<small>${other}</small></div>
  </div>`;
};

const views = {
  inicio() {
    const total = db.accounts.reduce((s, a) => s + toUSD(accBalance(a), a.cur), 0);
    const moves = [...db.moves].sort((a, b) => b.date.localeCompare(a.date));
    return `
      <div class="hello">
        <div><small>Finanzas de la</small><h1>Familia 👋</h1></div>
        <button class="rate" id="rateBtn">Tasa: <b>Bs ${num(db.rate)}</b></button>
      </div>
      <div class="balance">
        <small>Saldo total</small>
        <div class="big">${fmt(total, 'USD')}</div>
        <div class="bs">≈ ${fmt(total * db.rate, 'VES')}</div>
      </div>
      <h2>Cuentas</h2>
      <div class="accounts">${db.accounts.map(a => `
        <div class="acc"><div class="ico">${a.ico}</div><div class="name">${a.name}</div><div class="amt">${fmt(accBalance(a), a.cur)}</div></div>`).join('')}
      </div>
      <h2>Movimientos</h2>
      <div class="list">${moves.length ? moves.map(rowHTML).join('') : '<div class="empty">Sin movimientos</div>'}</div>
      <p class="note">Prototipo con datos de ejemplo · <span class="link" id="reset">reiniciar datos</span></p>`;
  },
  presupuesto() {
    const spent = {};
    db.moves.filter(m => m.type === 'gasto' && thisMonth(m)).forEach(m => spent[m.cat] = (spent[m.cat] || 0) + toUSD(m.amount, m.cur));
    const mes = new Date().toLocaleDateString('es-VE', { month: 'long' });
    return `
      <div class="hello"><div><small>Presupuesto de</small><h1 style="text-transform:capitalize">${mes}</h1></div></div>
      ${Object.entries(db.budgets).map(([cat, lim]) => {
        const s = spent[cat] || 0, pct = Math.min(100, s / lim * 100);
        return `<div class="bud">
          <div class="top"><span>${CATS[cat]} ${cat}</span><span>${fmt(s, 'USD')} de ${fmt(lim, 'USD')}</span></div>
          <div class="bar"><i class="${s > lim ? 'over' : pct > 75 ? 'warn' : ''}" style="width:${pct}%"></i></div>
        </div>`;
      }).join('')}
      <p class="note">Agrega un gasto con el botón + y mira cómo se mueve la barra.</p>`;
  },
  familia() {
    const by = {};
    db.moves.filter(m => m.type === 'gasto' && thisMonth(m)).forEach(m => by[m.who] = (by[m.who] || 0) + toUSD(m.amount, m.cur));
    const max = Math.max(1, ...Object.values(by));
    return `
      <div class="hello"><div><small>Quién gastó qué</small><h1>Este mes</h1></div></div>
      ${PEOPLE.map(p => `<div class="bud">
        <div class="top"><span>${p === 'Hogar' ? '🏠' : '🙂'} ${p}</span><span>${fmt(by[p] || 0, 'USD')}</span></div>
        <div class="bar"><i style="width:${(by[p] || 0) / max * 100}%; background: var(--blue)"></i></div>
      </div>`).join('')}
      <p class="note">En la versión real cada persona entraría con su propio usuario.</p>`;
  },
};

let tab = 'inicio';
const $ = id => document.getElementById(id);
function render() {
  $('app').innerHTML = views[tab]();
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const rateBtn = $('rateBtn');
  if (rateBtn) rateBtn.onclick = () => {
    const v = parseFloat((prompt('Tasa del día (Bs por 1 $):', db.rate) || '').replace(',', '.'));
    if (v > 0) { db.rate = v; persist(); render(); }
  };
  const reset = $('reset');
  if (reset) reset.onclick = () => { db = seed(); persist(); render(); };
}
$('nav').onclick = e => { const b = e.target.closest('button'); if (b) { tab = b.dataset.tab; render(); scrollTo(0, 0); } };

// Hoja de "nuevo movimiento"
const form = { type: 'gasto', cur: 'USD', cat: 'Mercado', who: 'Luis' };
const parseAmount = () => parseFloat($('fAmount').value.replace(',', '.')) || 0;
function paintForm() {
  document.querySelectorAll('#segType button').forEach(b => b.classList.toggle('on', b.dataset.v === form.type));
  document.querySelectorAll('#segCur button').forEach(b => b.classList.toggle('on', b.dataset.v === form.cur));
  $('chipsCat').style.display = form.type === 'gasto' ? '' : 'none';
  $('chipsCat').innerHTML = Object.keys(CATS).filter(c => c !== 'Ingreso')
    .map(c => `<button data-v="${c}" class="${c === form.cat ? 'on' : ''}">${CATS[c]} ${c}</button>`).join('');
  $('chipsWho').innerHTML = PEOPLE.map(p => `<button data-v="${p}" class="${p === form.who ? 'on' : ''}">${p}</button>`).join('');
  const n = parseAmount();
  $('equiv').textContent = n ? '≈ ' + (form.cur === 'USD' ? fmt(n * db.rate, 'VES') : fmt(n / db.rate, 'USD')) : '';
}
const pick = (id, key) => $(id).onclick = e => { const b = e.target.closest('button'); if (b) { form[key] = b.dataset.v; paintForm(); } };
pick('segType', 'type'); pick('segCur', 'cur'); pick('chipsCat', 'cat'); pick('chipsWho', 'who');
$('fAmount').oninput = paintForm;

const toggle = open => $('modal').classList.toggle('open', open);
$('fab').onclick = () => {
  $('fAmount').value = ''; $('fDesc').value = '';
  $('fAcc').innerHTML = db.accounts.map(a => `<option value="${a.id}">${a.ico} ${a.name} (${a.cur === 'USD' ? '$' : 'Bs'})</option>`).join('');
  paintForm(); toggle(true);
};
$('shade').onclick = () => toggle(false);
$('save').onclick = () => {
  const n = parseAmount();
  if (!n) { $('fAmount').focus(); return; }
  const acc = db.accounts.find(a => a.id === $('fAcc').value);
  // el movimiento se guarda en la moneda de la cuenta, convertido con la tasa del día
  const amount = form.cur === acc.cur ? n : form.cur === 'USD' ? n * db.rate : n / db.rate;
  const cat = form.type === 'gasto' ? form.cat : 'Ingreso';
  db.moves.push({ id: Date.now(), type: form.type, desc: $('fDesc').value.trim() || cat, cat, amount, cur: acc.cur, acc: acc.id, who: form.who, date: new Date().toISOString() });
  persist(); toggle(false); render();
};

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
